# Pushing a tag like v1.2.3 tests the code, builds static Linux binaries for
# amd64, ARMv6 (Raspberry Pi 1/Zero), ARMv7 and aarch64 plus a Windows x64 binary,
# and publishes them as a GitHub release. Everything is pure Rust, so rust-lld
# links all Linux targets without a cross toolchain.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked --release

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: armv6
            target: arm-unknown-linux-musleabihf
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Package
        run: |
          name="cdverify-${GITHUB_REF_NAME}-linux-${ARCH}"
          mkdir "$name"
          cp "target/$TARGET/release/cdverify" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.arch }}
          path: cdverify-*.tar.gz*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Static CRT: the .exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Package
        run: |
          name="cdverify-${GITHUB_REF_NAME}-windows-x64"
          mkdir "$name"
          cp target/release/cdverify.exe README.md LICENSE "$name/"
          7z a "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: cdverify-*.zip*
          if-no-files-found: error

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
